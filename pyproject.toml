[project]
name = "mcp-gateway-lab"
version = "0.2.0"
description = "Score any MCP security gateway against an agent that attacks it (mcp-lab), plus a reference gateway (policy, schema validation, HMAC hash-chained audit log)."
readme = "README.md"
license = "MIT"
authors = [{ name = "Muhammad Faheem" }]
keywords = ["mcp", "model-context-protocol", "ai-agent-security", "security-gateway", "audit-log", "red-teaming", "benchmark"]
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.20",
    "mcp>=2.3,<3",
    "pydantic>=2.7",
    "pyyaml>=6",
    "rfc8785>=0.1.4",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/faheemgurkani/mcp-security-gateway-hashchain-audit"
Documentation = "https://github.com/faheemgurkani/mcp-security-gateway-hashchain-audit/blob/main/docs/GUIDE.md"
Issues = "https://github.com/faheemgurkani/mcp-security-gateway-hashchain-audit/issues"

[project.scripts]
mcp-lab-gateway = "mcp_lab.gateway.cli:app"
mcp-lab = "mcp_lab.cli:app"

[project.optional-dependencies]
external = [
    "mcp-gate-policy>=0.3,<0.4",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
