# This repo's reference gateway, described as a spec (an HTTP gateway example).
# `mcp-lab score --reference` scores it with a bespoke adapter instead, which also
# tries A12 with a guessed HMAC key; here A12 shows n/a because the chain is keyed.
name: reference-gateway
version: this repo
transport: http
setup:
  - "{{python}} -m mcp_gateway.cli keygen --out key > /dev/null"
files:
  sessions.yaml: |
    sessions:
      - principal: alice
        role: user
        # sha256 of the token "user-token-spec"
        token_sha256: f4419f98c0a72dece9c237317acef23c0eb01f86407853343ce9459770f73d38
command: >-
  {{python}} -m mcp_gateway.cli serve --upstream {{upstream}}
  --sessions sessions.yaml --key-file key --log audit.jsonl --anchor head.json
  --port {{port}} --heartbeat 3600
url: http://127.0.0.1:{{port}}/mcp
headers:
  Authorization: Bearer user-token-spec
log: "{{dir}}/audit.jsonl"
verify: "{{python}} -m mcp_gateway.cli verify {{log}} --key-file key --anchor head.json"
